name: Adjust header image layout
on:
  push:
    paths:
      - '.github/workflows/adjust-header-image.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make header image larger and move it right
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ".hero-inner{display:flex;align-items:center;gap:40px;max-width:1100px;margin:0 auto;width:100%;z-index:1;}\n.hero-img{flex-shrink:0;width:220px;height:260px;border-radius:20px;overflow:hidden;border:4px solid rgba(255,255,255,.3);box-shadow:0 12px 40px rgba(0,0,0,.3);}\n.hero-img img{width:100%;height:100%;object-fit:cover;}"
          new = ".hero-inner{display:flex;align-items:center;gap:50px;max-width:1200px;margin:0 auto;width:100%;z-index:1;}\n.hero-img{flex-shrink:0;width:290px;height:340px;border-radius:20px;overflow:hidden;border:4px solid rgba(255,255,255,.3);box-shadow:0 12px 40px rgba(0,0,0,.3);order:2;margin-left:auto;}\n.hero-img img{width:100%;height:100%;object-fit:cover;}"
          if old not in s:
              raise SystemExit('Header CSS block not found')
          s = s.replace(old, new, 1)
          marker = '</style>'
          responsive = "\n@media(max-width:700px){.hero-inner{gap:24px;}.hero-img{order:2;width:210px;height:250px;margin-left:0;}.hero-text{order:1;}}\n"
          if responsive.strip() not in s:
              s = s.replace(marker, responsive + marker, 1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/adjust-header-image.yml
          git rm .github/workflows/adjust-header-image.yml
          git commit -m 'Enlarge and move header image to the right'
          git push
