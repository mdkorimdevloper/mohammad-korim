name: Add e-commerce service
on:
  push:
    paths:
      - '.github/workflows/add-ecommerce-service.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add service and preserve image ratio
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  {id:1,title:'Full Stack Website Development',icon:'fas fa-laptop-code',description:'Professional and responsive websites for businesses, portfolios, startups, and online services.',tags:['Business Website','Portfolio Design','Landing Page','Web Apps'],duration:'5-10 Days',rating:'4.9',reviews:'150+',image:''},"
          new = "  {id:5,title:'Full Stack E-Commerce Website',icon:'fas fa-cart-shopping',description:'Complete, secure and scalable e-commerce website with frontend, backend, database, payment gateway integration, admin dashboard, SEO and responsive design.',tags:['Next.js','Node.js','MongoDB','Payment Gateway','Admin Dashboard','SEO'],duration:'7-14 Days',rating:'5.0',reviews:'New',image:'https://i.postimg.cc/FFLtgsWT/file-000000009d0081fa8c7959af5ce5a108.png'},\n" + old
          if "title:'Full Stack E-Commerce Website'" not in s:
              if old not in s:
                  raise SystemExit('defaultServices anchor not found')
              s = s.replace(old, new, 1)
          old_css = ".svc-card-img{width:100%;height:160px;object-fit:cover;display:block;}"
          new_css = ".svc-card-img{width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;display:block;}"
          if old_css in s:
              s = s.replace(old_css, new_css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-ecommerce-service.yml
          git rm .github/workflows/add-ecommerce-service.yml
          git commit -m 'Add Full Stack E-Commerce Website service'
          git push
