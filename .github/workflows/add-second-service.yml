name: Add second service
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add second service to default data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          image = 'https://i.postimg.cc/2ysBPdgP/1787666532892.png'
          if image in s:
              raise SystemExit('Second service already exists')
          old = "  {id:1,title:'Full Stack Website Development',icon:'fas fa-laptop-code',description:'Professional and responsive websites for businesses, portfolios, startups, and online services.',tags:['Business Website','Portfolio Design','Landing Page','Web Apps'],duration:'5-10 Days',rating:'4.9',reviews:'150+',image:''},"
          new = "  {id:5,title:'Web Development Service',icon:'fas fa-code',description:'Professional, responsive and modern website development tailored to your business or personal brand.',tags:['Web Development','Responsive','SEO Friendly'],duration:'7-14 Days',rating:'5.0',reviews:'New',image:'" + image + "'},\n" + old
          if old not in s:
              raise SystemExit('default service anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-second-service.yml
          git commit -m 'Add second service with new image'
          git push
