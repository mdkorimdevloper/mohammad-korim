name: Fix service image display
on:
  push:
    paths:
      - '.github/workflows/fix-service-image.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make service images fully visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".svc-card-img{width:100%;aspect-ratio:16/9;height:auto;object-fit:cover;display:block;}"
          new = ".svc-card-img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;display:block;background:#fff;}"
          if old not in s:
              raise SystemExit('service image CSS not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-service-image.yml
          git commit -m 'Fix service image sizing to show full artwork'
          git push
