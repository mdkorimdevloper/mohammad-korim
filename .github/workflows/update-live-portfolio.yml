name: Update Live Portfolio

on:
  push:
    paths:
      - '.github/workflows/update-live-portfolio.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make portfolio images clickable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = r"  const thumb = p\.img \? .*?\n"
          replacement = '''  const thumb = p.img ? `<a href="${p.link||'#'}" target="_blank" rel="noopener noreferrer" aria-label="Visit ${p.title}"><img src="${p.img}" alt="${p.title}" onerror="this.style.display='none';"></a>` : `<div class="port-thumb-placeholder"><i class="${typeIcons[p.type]||'fas fa-folder'}"></i></div>`;\n'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('portfolio thumbnail line not found')

          text = text.replace(".port-thumb img{width:100%;height:100%;object-fit:cover;}", ".port-thumb a{display:block;width:100%;height:100%;}.port-thumb img{width:100%;height:100%;object-fit:cover;display:block;}", 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make portfolio project images clickable"
          git push
