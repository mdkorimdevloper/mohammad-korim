<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Learning - MD Korim</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f8f6;color:#172019}header{background:linear-gradient(135deg,#145e2e,#23a355);color:#fff;padding:38px 6%;text-align:center}header h1{font-size:clamp(28px,5vw,48px);margin:0 0 10px}header p{margin:0;opacity:.9}.wrap{max-width:1050px;margin:auto;padding:30px 5% 70px}.card{background:#fff;border:1px solid #dce7df;border-radius:20px;margin:24px 0;overflow:hidden;box-shadow:0 8px 28px #145e2e12}.head{padding:24px 26px 12px;display:flex;gap:14px}.num{min-width:46px;height:46px;border-radius:14px;background:#e8f5ee;color:#145e2e;display:grid;place-items:center;font-weight:900}.head h2{margin:0 0 6px;font-size:clamp(22px,4vw,34px)}.sub{color:#68756d}.img{display:block;width:calc(100% - 40px);max-height:650px;object-fit:contain;margin:8px auto 20px;border-radius:15px;background:#f7faf8}.body{padding:0 26px 25px;line-height:1.9;color:#3d4941;white-space:pre-wrap}.open{margin:0 26px 26px;background:#1a7a3c;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#07130bdd;z-index:5;padding:12px}.modal.on{display:grid;place-items:center}.dialog{background:#fff;width:min(1050px,100%);height:min(94vh,900px);overflow:auto;border-radius:20px;position:relative}.close{position:sticky;top:12px;float:right;margin:12px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 15px #0002;z-index:2}.detail{padding:25px}.detail h2{font-size:clamp(28px,5vw,44px);color:#145e2e}.detailText{white-space:pre-wrap;line-height:1.95}.example{background:#eef8f1;border-left:5px solid #1a7a3c;padding:18px;border-radius:10px;white-space:pre-wrap;line-height:1.8}.draw{border:1px solid #dce7df;border-radius:15px;overflow:hidden}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:10px;background:#f0f5f1}.tools button,.tools label{padding:8px 11px;border:1px solid #ccd8cf;background:#fff;border-radius:8px}.stage{position:relative}.stage img{width:100%;display:block;max-height:650px;object-fit:contain}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.note{padding:9px 12px;color:#68756d;font-size:13px}@media(max-width:600px){.head,.body{padding-left:18px;padding-right:18px}.img{width:calc(100% - 24px)}.open{margin-left:18px;margin-right:18px}}</style></head><body><header><h1>Student Learning</h1><p>আজকের টপিক একের পর এক — ছবি, বিস্তারিত ব্যাখ্যা ও উদাহরণসহ</p></header><main class="wrap" id="list">লোড হচ্ছে...</main><div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeLesson()"><i class="fas fa-times"></i></button><div id="detail"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://ajnwfanzvdrjzpgnduhx.supabase.co','sb_publishable_m5aABZWO2OT6jQE8asfmpw_4c9ddAOj');let rows=[],ctx,canvas,img,mode='pen',size=5,color='#e11d48';async function load(){const r=await sb.from('learning_lessons').select('*').eq('is_published',true).order('sort_order',{ascending:true}).order('created_at',{ascending:true});rows=r.data||[];document.getElementById('list').innerHTML=rows.length?rows.map((x,i)=>`<article class="card"><div class="head"><span class="num">${i+1}</span><div><h2>${x.title||''}</h2><div class="sub">${x.subtitle||''}</div></div></div>${x.image_url?`<img class="img" src="${x.image_url}" alt="${x.title||''}" onclick="openLesson('${x.id}')">`:''}<div class="body">${(x.content||'').slice(0,500)}${(x.content||'').length>500?'…':''}</div><button class="open" onclick="openLesson('${x.id}')">বিস্তারিত দেখুন</button></article>`).join(''):'<div style="text-align:center;padding:60px">এখনও কোনো টপিক প্রকাশ করা হয়নি।</div>'}function openLesson(id){const x=rows.find(r=>r.id===id);if(!x)return;document.getElementById('detail').innerHTML=`<div class="detail"><h2>${x.title||''}</h2><p class="sub">${x.subtitle||''}</p>${x.image_url?`<div class="draw"><div class="tools"><button onclick="mode='pen'">Pen</button><button onclick="mode='eraser'">Eraser</button><label>Size <input id="sz" type="range" min="2" max="30" value="5"></label><input id="clr" type="color" value="#e11d48"><button onclick="clearDraw()">Clear</button><button onclick="downloadDraw()">Save Image</button></div><div class="stage"><img id="lessonImg" src="${x.image_url}"><canvas id="canvas"></canvas></div><div class="note">মোবাইলেও আঙুল দিয়ে ছবির উপর আঁকা যাবে।</div></div>`:''}<div class="detailText">${x.content||''}</div>${x.example?`<div class="example"><b>উদাহরণ:</b>\n${x.example}</div>`:''}</div>`;document.getElementById('modal').classList.add('on');if(x.image_url)setTimeout(initCanvas,150)}function closeLesson(){document.getElementById('modal').classList.remove('on')}function initCanvas(){img=document.getElementById('lessonImg');canvas=document.getElementById('canvas');const fit=()=>{const r=img.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0)};if(img.complete)fit();else img.onload=fit;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);ctx.beginPath();const r=canvas.getBoundingClientRect();ctx.moveTo(e.clientX-r.left,e.clientY-r.top);canvas.drawing=true};canvas.onpointermove=e=>{if(!canvas.drawing)return;const r=canvas.getBoundingClientRect();ctx.lineWidth=size;ctx.lineCap='round';ctx.strokeStyle=mode==='eraser'?'rgba(0,0,0,1)':color;ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};canvas.onpointerup=()=>canvas.drawing=false;document.getElementById('sz').oninput=e=>size=+e.target.value;document.getElementById('clr').oninput=e=>{color=e.target.value;mode='pen'}}function clearDraw(){if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height)}function downloadDraw(){const o=document.createElement('canvas'),r=img.getBoundingClientRect(),d=devicePixelRatio||1;o.width=r.width*d;o.height=r.height*d;const c=o.getContext('2d');c.drawImage(img,0,0,o.width,o.height);c.drawImage(canvas,0,0,o.width,o.height);const a=document.createElement('a');a.download='lesson-annotation.png';a.href=o.toDataURL('image/png');a.click()}load();</script></body></html>
