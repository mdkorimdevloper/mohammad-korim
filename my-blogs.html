<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Blogs — Mohammad Korim</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--green:#1a7a3c;--dark:#145e2e;--bg:#f7f9f7;--text:#171717;--muted:#666}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 15px #00000012}.nav{max-width:1150px;margin:auto;height:66px;padding:0 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-family:Poppins;font-weight:800;color:var(--green);text-decoration:none;font-size:1.2rem}.back{color:var(--green);text-decoration:none;font-weight:600;font-size:.9rem}.hero{background:linear-gradient(135deg,var(--dark),var(--green));padding:70px 5%;text-align:center;color:#fff}.hero h1{font-family:Poppins;font-size:clamp(2rem,5vw,3.2rem);margin:0 0 10px}.hero p{margin:0;opacity:.9}.wrap{max-width:1100px;margin:auto;padding:55px 5% 75px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:24px}.card{background:#fff;border:1px solid #e1e7e1;border-radius:16px;overflow:hidden;box-shadow:0 6px 22px #0000000b}.thumb{height:175px;background:#e7f3eb;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:21px}.date{font-size:.75rem;color:var(--green);font-weight:700;margin-bottom:8px}.card h2{font-family:Poppins;font-size:1.2rem;margin:0 0 9px}.card p{color:var(--muted);line-height:1.65;font-size:.88rem;margin:0 0 15px}.read{color:var(--green);font-weight:700;text-decoration:none;font-size:.86rem}.empty{text-align:center;color:var(--muted);padding:50px}footer{background:var(--green);color:#fff;text-align:center;padding:28px 5%;font-size:.88rem}footer strong{font-family:Poppins} @media(max-width:600px){.hero{padding:55px 5%}.wrap{padding-top:40px}}</style></head><body><header><div class="nav"><a class="brand" href="index.html">MD Korim</a><a class="back" href="index.html">← Back to Portfolio</a></div></header><section class="hero"><h1>My Blogs</h1><p>Articles, ideas, development tips and digital experiences by Mohammad Korim.</p></section><main class="wrap"><div id="blogs" class="grid"><div class="empty">Loading blogs...</div></div></main><footer><strong>I'm MD Korim</strong><br>Full Stack Developer &amp; Professional SEO Expert</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const c=supabase.createClient('https://ajnwfanzvdrjzpgnduhx.supabase.co','sb_publishable_m5aABZWO2OT6jQE8asfmpw_4c9ddAOj');const box=document.getElementById('blogs');const{data,error}=await c.from('blogs').select('*').eq('is_published',true).order('created_at',{ascending:false});if(error||!data?.length){box.innerHTML='<div class="empty">No blogs published yet.</div>';return}box.innerHTML=data.map(b=>`<article class="card">${b.image_url?`<div class="thumb"><img src="${b.image_url}" alt=""></div>`:''}<div class="body"><div class="date">${new Date(b.created_at).toLocaleDateString()}</div><h2>${String(b.title||'').replace(/</g,'&lt;')}</h2><p>${String(b.excerpt||b.content||'').replace(/</g,'&lt;').slice(0,180)}</p><a class="read" href="blog.html?id=${encodeURIComponent(b.id)}">Read More →</a></div></article>`).join('')})().catch(()=>{document.getElementById('blogs').innerHTML='<div class="empty">Unable to load blogs.</div>'})</script></body></html>
